<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LyconSalonRecord</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="lycon-theme.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="single-page.css"></head>
<body>
<div class="language-switch" aria-label="Language"><button type="button" data-language="ja">日本語</button><button type="button" data-language="en">English</button></div>
<div id="login" class="login-wrap">
  <section class="login-brand"><div class="brand-mark">L</div><h1>LyconSalonRecord</h1><p>紙のカルテを、次の接客につながる記録へ。</p><div class="feature-list"><span>✦ AI手書きカルテ読取</span><span>✦ AIカメラ</span><span>✦ AIサマリ生成</span><span>✦ お客様ごとの施術履歴</span><span>✦ アレルギー・注意事項を自動通知</span></div></section>
  <form id="loginForm" class="login-card"><div class="eyebrow">SALON WORKSPACE</div><h2>おかえりなさい</h2><p class="muted">店舗アカウントにログインしてください</p><label>ユーザーID<input name="userId" type="text" autocomplete="username" required></label><label>パスワード<input name="password" type="password" autocomplete="current-password" required></label><label id="tenantField" class="hidden">店舗を選択<select id="tenantSelect" name="tenantId"></select></label><button class="primary wide">ログイン</button><div class="demo-note">管理者から発行されたアカウントをご利用ください</div><p id="loginError" class="error"></p></form>
</div>
<div id="app" class="app hidden">
  <main><header><button id="homeButton" class="app-brand" type="button"><b>L</b><span>LyconSalonRecord<small id="salonName"></small></span><i id="aiStatus" class="ai-status" title="AI待機中" aria-label="AI待機中"><span>AI</span></i></button><span id="pageTitle" class="hidden"></span><span id="pageSub" class="hidden"></span><div class="header-actions"><div class="user-chip"><span id="userInitial"></span><div><b id="userName"></b><small id="userRole"></small></div></div><button id="logout" class="logout">ログアウト</button></div></header><div id="workspaceActions" class="workspace-actions"><button data-view="admin" class="admin-action hidden">稼働状況</button><button data-view="adminCustomers" class="admin-action hidden">契約会社・店舗管理</button></div><div id="content"></div></main>
</div>
<input id="footFilePicker" class="hidden" type="file" accept="image/png,image/jpeg,image/webp" multiple>
<div id="toast" class="toast"></div>
<script src="app.js"></script></body></html>
