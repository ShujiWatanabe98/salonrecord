services:
  - type: web
    name: salonrecord
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        # Managed manually in Render because SalonRecord shares the paid
        # PostgreSQL instance with HangoutNow while keeping its own tables.
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: SALON_NAME
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SYSTEM_ADMIN_ID
        value: admin
      - key: SYSTEM_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
      - key: SESSION_TTL_DAYS
        value: "7"
